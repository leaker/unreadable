# =============================================================================
# Manual backfill: rewrite leaker/scoop-bucket's unreadable.json for an
# existing GitHub Release.
#
# Normal releases are handled by release.yml, which bumps the Scoop manifest
# inline right after publishing. This workflow is an operator tool for when you
# need to bump out of band:
#   - re-run after rotating an expired PACKAGE_MANAGER_BUMP_TOKEN
#   - re-seed the manifest after a hand-edit in the bucket repo
#   - point the bucket at a release that predates release.yml
#
# It resolves a tag (explicit input, or the latest published release),
# downloads that release's amd64 zip, computes its sha256, regenerates
# bucket/unreadable.json, and commits + pushes. It is idempotent: a re-run
# against an already-bumped tag prints "nothing to push" and exits cleanly.
#
# Needs PACKAGE_MANAGER_BUMP_TOKEN (a PAT with write access to
# leaker/scoop-bucket). See RELEASING.md. All event/input values flow through
# `env:` and are dereferenced as quoted shell variables.
# =============================================================================

name: Bump Scoop manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to the latest published release."
        required: false

permissions:
  contents: read

jobs:
  bump:
    name: Bump scoop-bucket
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Download release zip and compute sha256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts && cd artifacts
          for arch in amd64 386; do
            ZIP="unreadable-${VERSION}-windows-${arch}.zip"
            gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --pattern "$ZIP"
            SHA=$(sha256sum "$ZIP" | awk '{print $1}')
            echo "zip_sha256_${arch}=$SHA" >> "$GITHUB_OUTPUT"
            echo "${arch} sha256: $SHA"
          done

      - name: Validate bump token
        env:
          PACKAGE_MANAGER_BUMP_TOKEN: ${{ secrets.PACKAGE_MANAGER_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGE_MANAGER_BUMP_TOKEN}" ]; then
            echo "::error::PACKAGE_MANAGER_BUMP_TOKEN is required to push the Scoop manifest update."
            exit 1
          fi

      - name: Checkout scoop-bucket
        uses: actions/checkout@v4
        with:
          repository: leaker/scoop-bucket
          token: ${{ secrets.PACKAGE_MANAGER_BUMP_TOKEN }}
          path: bucket

      - name: Update and push Scoop manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA_AMD64: ${{ steps.sha.outputs.zip_sha256_amd64 }}
          SHA_386: ${{ steps.sha.outputs.zip_sha256_386 }}
        run: |
          set -euo pipefail
          cd bucket
          python3 <<'PY'
          import json, os, pathlib
          v    = os.environ["VERSION"]
          base = f"https://github.com/leaker/unreadable/releases/download/v{v}"
          manifest = {
              "version": v,
              "description": "Scan a directory for unreadable files: locked, no-permission, path-too-long or I/O errors",
              "homepage": "https://github.com/leaker/unreadable",
              "license": "MIT",
              "architecture": {
                  "64bit": {"url": f"{base}/unreadable-{v}-windows-amd64.zip", "hash": os.environ["SHA_AMD64"]},
                  "32bit": {"url": f"{base}/unreadable-{v}-windows-386.zip", "hash": os.environ["SHA_386"]},
              },
              "bin": "unreadable.exe",
              "checkver": {"github": "https://github.com/leaker/unreadable"},
              "autoupdate": {
                  "architecture": {
                      "64bit": {"url": "https://github.com/leaker/unreadable/releases/download/v$version/unreadable-$version-windows-amd64.zip"},
                      "32bit": {"url": "https://github.com/leaker/unreadable/releases/download/v$version/unreadable-$version-windows-386.zip"},
                  },
              },
          }
          pathlib.Path("bucket/unreadable.json").write_text(json.dumps(manifest, indent=4) + "\n")
          PY
          git add bucket/unreadable.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already at ${VERSION} -- nothing to push."
            exit 0
          fi
          git --no-pager diff --cached bucket/unreadable.json
          git -c user.name="leaker[bot]" -c user.email="claude@leelib.com" \
            commit -m "unreadable: bump to ${VERSION}"
          git push origin HEAD:main
