# =============================================================================
# Release pipeline.
#
# Trigger
# -------
#   - push of a tag matching `v*` (e.g. v0.1.0, v1.2.3, v1.2.3-rc1):
#       build the Windows binary, package a zip, publish a GitHub Release with
#       the zip + checksums attached, then push an updated Scoop manifest to
#       leaker/scoop-bucket.
#   - workflow_dispatch: build + package only (no Release, no Scoop bump). Use
#       it to smoke-test the build path without cutting a tag.
#
# <version> is the tag with the leading `v` stripped (so `v1.2.3` -> `1.2.3`,
# `v1.2.3-rc1` -> `1.2.3-rc1`). Pre-release tags (`-rc`, `-beta`, `-alpha`) are
# published as GitHub prereleases and deliberately SKIP the Scoop bump, so a
# beta never displaces the stable version in `scoop update`.
#
# Cross-repo push needs a PAT, not GITHUB_TOKEN
# ---------------------------------------------
# The default GITHUB_TOKEN is scoped to this repo only. Pushing the manifest
# into leaker/scoop-bucket requires a Personal Access Token stored as the
# `PACKAGE_MANAGER_BUMP_TOKEN` secret. See RELEASING.md for setup.
#
# Workflow-injection hardening
# ----------------------------
# Every value taken from the event context (tag name, version) enters shell
# steps through `env:` and is dereferenced as a quoted shell variable. We never
# inline `${{ github.* }}` into a `run:` body.
# =============================================================================

name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Read-only by default; the PAT carries write access to the downstream repo,
# and GITHUB_TOKEN needs `contents: write` only to create the Release.
permissions:
  contents: write

jobs:
  release:
    name: Build, release and bump Scoop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Build broken code should never reach a Release. This runs the
      # platform-independent suite on Linux; the Windows-specific
      # syscall.CreateFile path is covered by ci.yml on windows-latest.
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      # ----------------------------------------------------------------------
      # Resolve version + release classification from the ref.
      #   version  -> tag without the leading `v`, or a dev string on dispatch
      #   is_tag   -> true when triggered by a v* tag (gates the Release)
      #   stable   -> true for a v* tag with no -rc/-beta/-alpha suffix
      #               (gates the Scoop bump)
      # ----------------------------------------------------------------------
      - name: Resolve version
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            IS_TAG=true
            VERSION="${REF_NAME#v}"
          else
            IS_TAG=false
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          STABLE=false
          if [[ "$IS_TAG" == true && "$VERSION" != *-rc* && "$VERSION" != *-beta* && "$VERSION" != *-alpha* ]]; then
            STABLE=true
          fi
          {
            echo "version=$VERSION"
            echo "is_tag=$IS_TAG"
            echo "stable=$STABLE"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION is_tag=$IS_TAG stable=$STABLE"

      - name: Build and package
        id: pkg
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          # One zip per Windows arch so Scoop can pick 64bit / 32bit per system.
          # GOARCH amd64 -> Scoop "64bit", 386 -> Scoop "32bit".
          for arch in amd64 386; do
            rm -rf build && mkdir -p build
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o build/unreadable.exe .
            cp README.md LICENSE build/
            ZIP="unreadable-${VERSION}-windows-${arch}.zip"
            ( cd build && zip -9 "../dist/${ZIP}" unreadable.exe README.md LICENSE )
            SHA=$(sha256sum "dist/${ZIP}" | awk '{print $1}')
            echo "zip_sha256_${arch}=$SHA" >> "$GITHUB_OUTPUT"
          done

          ( cd dist && sha256sum "unreadable-${VERSION}-windows-"*.zip | tee "unreadable-${VERSION}-checksums.txt" )
          ls -la dist

      # ----------------------------------------------------------------------
      # Publish the GitHub Release (tag pushes only). The body is prepended to
      # GitHub's auto-generated changelog.
      # ----------------------------------------------------------------------
      - name: Publish GitHub Release
        if: ${{ steps.meta.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.meta.outputs.stable == 'false' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install (Windows)

            ```
            scoop bucket add leaker https://github.com/leaker/scoop-bucket
            scoop install unreadable
            ```

            Or download the `windows-amd64` (64-bit) or `windows-386` (32-bit) zip
            below and extract `unreadable.exe`.

            See the [README](https://github.com/leaker/unreadable#readme) for usage.
          files: |
            dist/unreadable-*-windows-amd64.zip
            dist/unreadable-*-windows-386.zip
            dist/unreadable-*-checksums.txt

      # ----------------------------------------------------------------------
      # Scoop manifest bump (stable tags only).
      #
      # The manifest is generated in full from the template below, so the first
      # release seeds bucket/unreadable.json and later releases keep it
      # consistent. `git add` + `git diff --cached` makes this work for both a
      # brand-new file and an update, and makes a re-run against an
      # already-bumped tag a no-op instead of an empty commit.
      # ----------------------------------------------------------------------
      - name: Validate bump token
        if: ${{ steps.meta.outputs.stable == 'true' }}
        env:
          PACKAGE_MANAGER_BUMP_TOKEN: ${{ secrets.PACKAGE_MANAGER_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGE_MANAGER_BUMP_TOKEN}" ]; then
            echo "::error::PACKAGE_MANAGER_BUMP_TOKEN is required to push the Scoop manifest update."
            exit 1
          fi

      - name: Checkout scoop-bucket
        if: ${{ steps.meta.outputs.stable == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: leaker/scoop-bucket
          token: ${{ secrets.PACKAGE_MANAGER_BUMP_TOKEN }}
          path: bucket

      - name: Update and push Scoop manifest
        if: ${{ steps.meta.outputs.stable == 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA_AMD64: ${{ steps.pkg.outputs.zip_sha256_amd64 }}
          SHA_386: ${{ steps.pkg.outputs.zip_sha256_386 }}
        run: |
          set -euo pipefail
          cd bucket
          python3 <<'PY'
          import json, os, pathlib
          v    = os.environ["VERSION"]
          base = f"https://github.com/leaker/unreadable/releases/download/v{v}"
          manifest = {
              "version": v,
              "description": "Scan a directory for unreadable files: locked, no-permission, path-too-long or I/O errors",
              "homepage": "https://github.com/leaker/unreadable",
              "license": "MIT",
              "architecture": {
                  "64bit": {"url": f"{base}/unreadable-{v}-windows-amd64.zip", "hash": os.environ["SHA_AMD64"]},
                  "32bit": {"url": f"{base}/unreadable-{v}-windows-386.zip", "hash": os.environ["SHA_386"]},
              },
              "bin": "unreadable.exe",
              "checkver": {"github": "https://github.com/leaker/unreadable"},
              "autoupdate": {
                  "architecture": {
                      "64bit": {"url": "https://github.com/leaker/unreadable/releases/download/v$version/unreadable-$version-windows-amd64.zip"},
                      "32bit": {"url": "https://github.com/leaker/unreadable/releases/download/v$version/unreadable-$version-windows-386.zip"},
                  },
              },
          }
          pathlib.Path("bucket/unreadable.json").write_text(json.dumps(manifest, indent=4) + "\n")
          PY
          git add bucket/unreadable.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already at ${VERSION} -- nothing to push."
            exit 0
          fi
          git --no-pager diff --cached bucket/unreadable.json
          git -c user.name="leaker[bot]" -c user.email="claude@leelib.com" \
            commit -m "unreadable: bump to ${VERSION}"
          git push origin HEAD:main
